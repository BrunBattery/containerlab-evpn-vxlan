! Phase 1: routed IPv4 underlay only.
hostname spine01
!
no aaa root
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.1/32
!
interface Ethernet1
   description TO_leaf01_Ethernet1
   no switchport
   ip address 10.0.1.0/31
   no shutdown
!
interface Ethernet2
   description TO_leaf02_Ethernet1
   no switchport
   ip address 10.0.2.0/31
   no shutdown
!
interface Ethernet3
   description TO_leaf03_Ethernet1
   no switchport
   ip address 10.0.3.0/31
   no shutdown
!
interface Ethernet4
   description TO_leaf04_Ethernet1
   no switchport
   ip address 10.0.4.0/31
   no shutdown
!
ip routing
!
router bgp 65000
   router-id 10.255.0.1
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   neighbor 10.0.1.1 remote-as 65101
   neighbor 10.0.2.1 remote-as 65102
   neighbor 10.0.3.1 remote-as 65103
   neighbor 10.0.4.1 remote-as 65104
   !
   address-family ipv4
      neighbor 10.0.1.1 activate
      neighbor 10.0.2.1 activate
      neighbor 10.0.3.1 activate
      neighbor 10.0.4.1 activate
      network 10.255.0.1/32
!
end
