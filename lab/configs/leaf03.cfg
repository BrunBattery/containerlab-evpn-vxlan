! eBGP underlay and EVPN overlay, one L2 VXLAN service.
hostname leaf03
!
no aaa root
!
service routing protocols model multi-agent
!
interface Loopback0
   description ROUTER_ID_AND_EVPN_PEERING
   ip address 10.255.0.13/32
!
interface Loopback1
   description VXLAN_VTEP
   ip address 10.255.1.13/32
!
interface Ethernet1
   description TO_spine01_Ethernet3
   no switchport
   mtu 9000
   ip address 10.0.3.1/31
   no shutdown
!
interface Ethernet2
   description TO_spine02_Ethernet3
   no switchport
   mtu 9000
   ip address 10.0.3.3/31
   no shutdown
!
vlan 10
   name L2_TEST
!
interface Ethernet3
   description TO_client03_eth1
   switchport mode access
   switchport access vlan 10
   no shutdown
!
interface Vxlan1
   description L2_EVPN_SERVICE
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
!
ip routing
!
router bgp 65103
   router-id 10.255.0.13
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   neighbor 10.0.3.0 remote-as 65000
   neighbor 10.0.3.2 remote-as 65000
   neighbor EVPN_SPINES peer group
   neighbor EVPN_SPINES update-source Loopback0
   neighbor EVPN_SPINES ebgp-multihop 3
   neighbor EVPN_SPINES send-community extended
   neighbor 10.255.0.1 peer group EVPN_SPINES
   neighbor 10.255.0.1 remote-as 65000
   neighbor 10.255.0.2 peer group EVPN_SPINES
   neighbor 10.255.0.2 remote-as 65000
   !
   vlan 10
      rd 10.255.0.13:10
      route-target both 65000:10010
      redistribute learned
   !
   address-family ipv4
      neighbor 10.0.3.0 activate
      neighbor 10.0.3.2 activate
      network 10.255.0.13/32
      network 10.255.1.13/32
   !
   address-family evpn
      neighbor EVPN_SPINES activate
!
end
