! Phase 1: routed IPv4 underlay only.
hostname leaf03
!
no aaa root
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.13/32
!
interface Ethernet1
   description TO_spine01_Ethernet3
   no switchport
   ip address 10.0.3.1/31
   no shutdown
!
interface Ethernet2
   description TO_spine02_Ethernet3
   no switchport
   ip address 10.0.3.3/31
   no shutdown
!
ip routing
!
router bgp 65103
   router-id 10.255.0.13
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   neighbor 10.0.3.0 remote-as 65000
   neighbor 10.0.3.2 remote-as 65000
   !
   address-family ipv4
      neighbor 10.0.3.0 activate
      neighbor 10.0.3.2 activate
      network 10.255.0.13/32
!
end
