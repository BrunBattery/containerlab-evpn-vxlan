! eBGP underlay and EVPN overlay, one L2 VXLAN service.
hostname spine02
!
no aaa root
!
service routing protocols model multi-agent
!
interface Loopback0
   description ROUTER_ID_AND_EVPN_PEERING
   ip address 10.255.0.2/32
!
interface Ethernet1
   description TO_leaf01_Ethernet2
   no switchport
   mtu 9000
   ip address 10.0.1.2/31
   no shutdown
!
interface Ethernet2
   description TO_leaf02_Ethernet2
   no switchport
   mtu 9000
   ip address 10.0.2.2/31
   no shutdown
!
interface Ethernet3
   description TO_leaf03_Ethernet2
   no switchport
   mtu 9000
   ip address 10.0.3.2/31
   no shutdown
!
interface Ethernet4
   description TO_leaf04_Ethernet2
   no switchport
   mtu 9000
   ip address 10.0.4.2/31
   no shutdown
!
ip routing
!
router bgp 65000
   router-id 10.255.0.2
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   neighbor 10.0.1.3 remote-as 65101
   neighbor 10.0.2.3 remote-as 65102
   neighbor 10.0.3.3 remote-as 65103
   neighbor 10.0.4.3 remote-as 65104
   neighbor EVPN_LEAVES peer group
   neighbor EVPN_LEAVES update-source Loopback0
   neighbor EVPN_LEAVES ebgp-multihop 3
   neighbor EVPN_LEAVES send-community extended
   neighbor EVPN_LEAVES next-hop-unchanged
   neighbor 10.255.0.11 peer group EVPN_LEAVES
   neighbor 10.255.0.11 remote-as 65101
   neighbor 10.255.0.12 peer group EVPN_LEAVES
   neighbor 10.255.0.12 remote-as 65102
   neighbor 10.255.0.13 peer group EVPN_LEAVES
   neighbor 10.255.0.13 remote-as 65103
   neighbor 10.255.0.14 peer group EVPN_LEAVES
   neighbor 10.255.0.14 remote-as 65104
   !
   address-family ipv4
      neighbor 10.0.1.3 activate
      neighbor 10.0.2.3 activate
      neighbor 10.0.3.3 activate
      neighbor 10.0.4.3 activate
      network 10.255.0.2/32
   !
   address-family evpn
      neighbor EVPN_LEAVES activate
!
end
