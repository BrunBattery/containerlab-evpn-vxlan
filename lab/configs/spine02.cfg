! Phase 1: routed IPv4 underlay only.
hostname spine02
!
no aaa root
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.2/32
!
interface Ethernet1
   description TO_leaf01_Ethernet2
   no switchport
   ip address 10.0.1.2/31
   no shutdown
!
interface Ethernet2
   description TO_leaf02_Ethernet2
   no switchport
   ip address 10.0.2.2/31
   no shutdown
!
interface Ethernet3
   description TO_leaf03_Ethernet2
   no switchport
   ip address 10.0.3.2/31
   no shutdown
!
interface Ethernet4
   description TO_leaf04_Ethernet2
   no switchport
   ip address 10.0.4.2/31
   no shutdown
!
ip routing
!
router bgp 65000
   router-id 10.255.0.2
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   neighbor 10.0.1.3 remote-as 65101
   neighbor 10.0.2.3 remote-as 65102
   neighbor 10.0.3.3 remote-as 65103
   neighbor 10.0.4.3 remote-as 65104
   !
   address-family ipv4
      neighbor 10.0.1.3 activate
      neighbor 10.0.2.3 activate
      neighbor 10.0.3.3 activate
      neighbor 10.0.4.3 activate
      network 10.255.0.2/32
!
end
