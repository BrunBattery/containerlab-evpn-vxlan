! Phase 1: routed IPv4 underlay only.
hostname leaf04
!
no aaa root
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.14/32
!
interface Ethernet1
   description TO_spine01_Ethernet4
   no switchport
   ip address 10.0.4.1/31
   no shutdown
!
interface Ethernet2
   description TO_spine02_Ethernet4
   no switchport
   ip address 10.0.4.3/31
   no shutdown
!
ip routing
!
router bgp 65104
   router-id 10.255.0.14
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   neighbor 10.0.4.0 remote-as 65000
   neighbor 10.0.4.2 remote-as 65000
   !
   address-family ipv4
      neighbor 10.0.4.0 activate
      neighbor 10.0.4.2 activate
      network 10.255.0.14/32
!
end
